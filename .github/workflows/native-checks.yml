name: Native app verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android build and launch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      RECIPEAK_CI_VERIFY_BUILD: '1'
      RECIPEAK_LOCAL_DEBUG_SIGNING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: bash ../../security/install-android-ndk.sh
      - run: install -Dm644 ../../security/maven-central-mirror.init.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/recipeak-maven-central.gradle"
      - run: npx expo prebuild --platform android --no-install
      - name: Compile, test and lint the native release
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64,arm64-v8a
        env:
          NODE_ENV: production
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch the bundled app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash security/android-smoke.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-NOT-FOR-PLAY
          retention-days: 30
          path: |
            apps/mobile/android/app/build/reports/
            apps/mobile/android/app/build/test-results/
            android-smoke-*
  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: npx pod-install ios
      - name: Compile the full simulator app
        run: xcodebuild -workspace ios/Recipeak.xcworkspace -scheme Recipeak -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
