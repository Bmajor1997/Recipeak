name: Meals and Mixers Code Quality & Security Checks

# Ported from Votic's security-checks.yml. Language-specific steps (npm) switch on
# automatically once the app has a package-lock.json.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    # Needs GitHub Advanced Security on private repositories; runs automatically once the repo is public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes for vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL Security Analysis
    # Needs GitHub Advanced Security on private repositories; runs automatically once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript, actions
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

  security:
    name: Security Scans and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Test the security tooling itself
        run: node --test code_checks/*.test.js

      - name: Install app dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts
      - name: Check dependencies for vulnerabilities
        if: always() && hashFiles('package-lock.json') != ''
        run: |
          npm audit --json > npm-audit.json || true
          node security/update-vulnerability-report.cjs npm-audit.json
          node security/check-npm-audit.cjs npm-audit.json
      - name: Preserve dependency audit report
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-vulnerability-report
          retention-days: 90
          path: |
            npm-audit.json
            security/vulnerability-report.md

      - name: Scan dependencies with OSV-Scanner
        if: always() && hashFiles('**/package-lock.json', '**/requirements*.txt', '**/poetry.lock', '**/pubspec.lock', '**/Podfile.lock', '**/build.gradle*') != ''
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0 scan --config=/src/osv-scanner.toml -r /src

      - name: Scan source code with Semgrep
        if: always()
        # The official image bundles compatible Python dependencies; pin its content as well as its version.
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --config auto . --error

      - name: Scan repository for exposed secrets
        if: always()
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Require a complete nonempty secret scan
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-list --all --count)" -gt 0
          gitleaks_bin="$(node -p 'require("node:path").join(require("node:os").tmpdir(), "gitleaks-8.30.1", "gitleaks")')"
          test -x "$gitleaks_bin"
          "$gitleaks_bin" git --log-opts="--all" --redact --verbose --no-banner 2>&1 | tee gitleaks-scan.log
          node security/verify-gitleaks-log.cjs gitleaks-scan.log
